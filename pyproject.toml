[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schemaguard"
version = "0.1.0"
description = "Data quality inspection and privacy redaction CLI tool"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff"
]

[project.scripts]
schemaguard = "schemaguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-v --cov=src"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
